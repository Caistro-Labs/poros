# The models Poros names: what `poros models` lists and what words like
# "qwen 7b" resolve to (the CLI interface design, section 4).
#
# Per model:
#   id        the Hugging Face repo id
#   arch      its config.json model_type (checked against arch_registry)
#   family    a word people type; "qwen2.5" also answers to "qwen"
#   size      parameters, as people say it ("7b", "30b")
#   variant   base | instruct | coder ("instruct" = post-trained: Qwen3's
#             hybrid-thinking checkpoints are instruct, their -Base repos base)
#   entry     dense | moe (the training path)
#   evidence  validated: a parity receipt ran THIS id (`receipt`): the whole
#             model, or its first layers (the receipt's line says which)
#             measured: a measured training run of THIS id (`receipt`), and no
#             parity receipt of it ships: it trains, and nothing says bit for bit
#             same-shape: architecture and tensor shapes identical to a
#             validated id (`via`); its own weights were not parity-tested
#             none: no parity receipt ran this whole model; what its
#             architecture runs on is the registry's to say
#   receipt   the parity receipt (validated), a run of this id (measured,
#             same-shape),
#             or what ran of its real first layers (none)
#   gated     the repo needs a license accepted on huggingface.co
#   aliases   extra words that name it
#   metal     the Mac table, one row per length on one device class. A same-shape
#             model uses its base's rows; no row means it does not train there.
#             evidence: what a gate that ran this whole model at this length says, on
#             that class. validated: it held to one graph (direct). checked: it ran
#             twice, or from both sources, the same (repeat, streaming). measured: no such
#             gate, but a real run gives figures. none: neither. A trim moves nothing.
#             evidence, receipt and macos_build are written from the Mac's runs.
#             method: what `prove` compares, when not what the tier implies. 7B runs
#             from disk, and memory can still hold it for a gate.
#
# No sizes, memory or speed here: those come from receipts (the plan's
# cells) and the Hub, one source per number. tests/test_catalog.py checks
# every entry against the receipts and the architecture registry.

