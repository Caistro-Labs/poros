name: Lint

# Every PR, no paths filter. Each step takes seconds. The same checks as
# .pre-commit-config.yaml.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: lint-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet 'ruff==0.17.6' 'codespell==2.4.3'

      - name: Python syntax
        run: python -m compileall -q -x '/\.' .

      - name: Ruff
        run: ruff check .

      - name: No leftover debugger calls
        run: |
          if git grep -nE '^\s*(breakpoint\(\)|import i?pdb\b|i?pdb\.set_trace\(\))' -- '*.py'; then
            echo "::error::Remove the debugger calls above."
            exit 1
          fi

      - name: Spelling
        # The skip and ignore lists are in .codespellrc.
        run: codespell
