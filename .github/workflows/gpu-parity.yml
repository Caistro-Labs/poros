name: GPU Parity

# Blockwise == resident, bitwise, can only be checked on real CUDA hardware. A maintainer
# starts this by hand on a self-hosted GPU runner; it never runs on a PR, and the CPU lanes
# are in tests.yml.
on:
  workflow_dispatch:
    inputs:
      model:
        description: "HF model id to test (validated architecture)"
        required: false
        default: "Qwen/Qwen2.5-0.5B"

permissions:
  contents: read

# One run at a time on the GPU.
concurrency:
  group: gpu-parity
  cancel-in-progress: false

jobs:
  gpu-parity:
    name: GPU parity
    # Requires a self-hosted runner labelled 'gpu' with CUDA + drivers.
    runs-on: [self-hosted, gpu]
    timeout-minutes: 120
    env:
      POROS_GPU_TEST_MODEL: ${{ inputs.model || 'Qwen/Qwen2.5-0.5B' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install Poros with its training stack
        run: python -m pip install -e ".[dev]"
      - name: Report GPU
        run: python -c "import torch; print(torch.__version__, torch.cuda.get_device_name(0))"
      - name: Run bitwise parity test
        run: pytest -m gpu -v
