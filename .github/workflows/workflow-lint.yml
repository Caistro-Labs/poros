name: Workflow lint

# Never give this a paths filter: every PR that touches a workflow must be checked.
# Fails closed.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workflow-lint-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Workflow lint
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet 'actionlint-py==1.7.12.25' 'zizmor==1.32.0'

      - name: Runners are named by variable, never written in
        # The public repository runs on GitHub's free hosted runners: every job reads its runner
        # from the LINUX_RUNNER or MAC_RUNNER repository variable and falls back to GitHub's. A
        # repository may set those variables to another service; a label written into a workflow
        # would follow the file into every copy of the repository.
        run: |
          if grep -nEi '^[[:space:]]*(-[[:space:]]*)?(runs-on|os|runner):.*(blacksmith|buildjet|depot|warpbuild|namespace-profile|ubicloud)' .github/workflows/*.yml; then
            echo "::error::A workflow names a paid runner. Set the LINUX_RUNNER or MAC_RUNNER repository variable instead."
            exit 1
          fi

      - name: No privileged triggers
        # These run with secrets against code from a PR. Banned here. Matched as a trigger (a key,
        # a list item, or the value of on:), so this step's own message is not one.
        run: |
          if grep -nE '^[^#]*(^|[[:space:],[{])(pull_request_target|workflow_run)[[:space:]]*($|[]:,}])' .github/workflows/*.yml; then
            echo "::error::pull_request_target and workflow_run are not allowed in this repo."
            exit 1
          fi

      - name: actionlint
        run: actionlint

      - name: zizmor
        run: zizmor --offline --min-severity medium .github/
