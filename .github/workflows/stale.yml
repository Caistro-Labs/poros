name: Stale

# Issues get an `inactive` label after 60 days and are never closed automatically. Pull
# requests are left alone: the repository takes none from outside.
on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: stale
  cancel-in-progress: false

jobs:
  stale:
    name: Mark stale
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 10
    permissions:
      issues: write # to label stale issues
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          days-before-issue-stale: 60
          days-before-issue-close: -1
          stale-issue-label: inactive
          stale-issue-message: >
            Is this still happening on the latest release? Reply here and we'll take
            another look.
          days-before-pr-stale: -1
          days-before-pr-close: -1
          exempt-issue-labels: pinned,security
          operations-per-run: 200
