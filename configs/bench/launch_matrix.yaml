# Poros Bench: the full benchmark matrix
#
# Cross-architecture, cross-scale comparison of Poros blockwise against all
# baselines under identical NF4 QLoRA conditions.  This is the matrix
# behind the paper's tables and the HTML report.
#
# Run:  poros bench matrix configs/bench/launch_matrix.yaml
# -------------------------------------------------------------------
spec_id: launch_matrix

hardware:
  gpu_name: "NVIDIA GeForce RTX 3090"
  vram_gb: 24.0
  pcie_gen: 4

models:
  - model_id: "Qwen/Qwen2.5-32B"
    display_name: "Qwen2.5-32B"
    param_count_b: 32.5
  - model_id: "Qwen/Qwen2.5-72B"
    display_name: "Qwen2.5-72B"
    param_count_b: 72.7
  - model_id: "Qwen/Qwen3-32B"
    display_name: "Qwen3-32B"
    param_count_b: 32.8

methods:
  - poros
  - resident
  - unsloth
  - peft
  - accelerate_offload

precisions:
  - nf4

training:
  steps: 200
  seq_len: 512
  batch_size: 1
  gradient_accumulation_steps: 8
  dataset: "synthetic"
  seed: 42

lora:
  rank: 16
  alpha: 32
  dropout: 0.0   # paper parity protocol: dropout=0.0 (was 0.05, the inherited QLoRA default)

poros:
  block_size: 4
  enable_prefetch: true

reporting:
  output_dir: "./bench_output/launch_matrix"
  html: true
  markdown: true
  emit_json: true
