# Poros B300 benchmark run -- Qwen2.5-72B (qwen2)
#
# 200 steps x 3 passes, NF4, on NVIDIA B300 SXM6. Per-model config so HF cache
# can be cleared between the large models (the machine's disk is the limit).
#
# gradient_accumulation_steps = 1 so one "step" == one optimizer step == one
# forward+backward (no per-microbatch vs per-optimizer-step ambiguity). The
# harness times every method per optimizer step, so slowdown compares like with like.
#
# Run twice for the two latest torch stacks:
#   torch 2.12+cu130 (.venv212): poros + resident   -> headline (latest torch)
#   torch 2.10+cu128 (.venv)    : poros + resident + unsloth (unsloth pins torch)
# -------------------------------------------------------------------
spec_id: official_b300_qwen25_72b

hardware:
  gpu_name: "NVIDIA B300 SXM6"
  vram_gb: 268.0
  pcie_gen: 5

models:
  - model_id: "Qwen/Qwen2.5-72B"
    display_name: "Qwen2.5-72B"
    param_count_b: 72.7

methods:
  - poros
  - resident

precisions:
  - nf4

training:
  steps: 200
  seq_len: 512
  batch_size: 1
  gradient_accumulation_steps: 1
  dataset: "synthetic"
  seed: 42
  n_passes: 3

lora:
  rank: 16
  alpha: 32
  dropout: 0.0   # paper parity protocol: dropout=0.0 (was 0.05, the inherited QLoRA default)

poros:
  block_size: 4
  enable_prefetch: true

reporting:
  output_dir: "./bench_output/official_b300/qwen25_72b"
  html: true
  markdown: true
  emit_json: true
