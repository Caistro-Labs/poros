# Poros Bench: Qwen2.5-7B on RTX 3090
#
# Reproduces the paper's 7B / RTX 3090 Table 3 run. It is not part of the
# benchmark set, which runs at 32B and above (see launch_matrix.yaml /
# official_b300_*.yaml / parity_all_archs.yaml), and its numbers are not
# benchmark figures.
#
# Single-GPU benchmark comparing Poros blockwise against resident, Unsloth,
# and PEFT baselines.  All methods use identical LoRA config, dataset, and
# training hyperparameters.
#
# Run:  poros bench run configs/bench/qwen2_5_7b_3090.yaml
# -------------------------------------------------------------------
spec_id: qwen2_5_7b_3090

hardware:
  gpu_name: "NVIDIA GeForce RTX 3090"
  vram_gb: 24.0
  pcie_gen: 4

models:
  - model_id: "Qwen/Qwen2.5-7B"
    display_name: "Qwen2.5-7B"
    param_count_b: 7.6

methods:
  - poros
  - resident
  - unsloth
  - peft

precisions:
  - nf4

training:
  steps: 200
  seq_len: 512
  batch_size: 1
  # 8 = the pipeline default (one recorded step spans all 8 micro-batches).
  # The paper's same-card table was measured at gradient_accumulation_steps: 1
  # -- set 1 here to reproduce its s/step numbers.
  gradient_accumulation_steps: 8
  dataset: "synthetic"
  seed: 42

lora:
  rank: 16
  alpha: 32
  dropout: 0.0   # paper parity protocol: dropout=0.0 (was 0.05, the inherited QLoRA default)

poros:
  block_size: 4
  enable_prefetch: true

reporting:
  output_dir: "./bench_output/qwen2_5_7b_3090"
  html: true
  markdown: true
  emit_json: true
