# Poros Bench: the full matrix across all validated architectures
#
# Step 2 of the validation: measured VRAM + speed numbers for every
# validated family (Qwen2.5, Qwen3) against the headline baselines, under
# identical NF4 QLoRA conditions, at the 30-70B scale: the matrix of the headline
# table.
#
# Set `hardware:` per machine (see docs/bench.md) when running the
# B300 / B200 / consumer tiers.
#
# Run:  poros bench matrix configs/bench/launch_matrix_all_archs.yaml
# -------------------------------------------------------------------
spec_id: launch_matrix_all_archs

hardware:
  gpu_name: "NVIDIA GeForce RTX 3090"   # override per machine/tier
  vram_gb: 24.0
  pcie_gen: 4

models:
  # Qwen2.5
  - model_id: "Qwen/Qwen2.5-32B"
    display_name: "Qwen2.5-32B"
    param_count_b: 32.5
  - model_id: "Qwen/Qwen2.5-72B"
    display_name: "Qwen2.5-72B"
    param_count_b: 72.7
  # Qwen3
  - model_id: "Qwen/Qwen3-32B"
    display_name: "Qwen3-32B"
    param_count_b: 32.8

methods:
  - poros
  - resident
  - unsloth

precisions:
  - nf4

training:
  steps: 200
  seq_len: 512
  batch_size: 1
  gradient_accumulation_steps: 8
  dataset: "synthetic"
  seed: 42
  n_passes: 3          # official runs: median + spread over 3 passes

lora:
  rank: 16
  alpha: 32
  dropout: 0.0   # paper parity protocol: dropout=0.0 (was 0.05, the inherited QLoRA default)

poros:
  block_size: 4
  enable_prefetch: true

reporting:
  output_dir: "./bench_output/launch_matrix_all_archs"
  html: true
  markdown: true
  emit_json: true
